name: PR Review Dispatch

on:
  pull_request_target:
    types: [ready_for_review, synchronize]

permissions: {}

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch:
    # Ce job appelle `twentyhq/ci-privileged`, un dépôt propre à l'upstream, avec un secret
    # que les forks n'ont pas : il y échoue donc systématiquement. Combiné à un ruleset qui
    # exige une revue approuvée, cela rend toute PR de fork non mergeable autrement qu'en
    # `--admin`, c'est-à-dire en contournant la barrière de revue. Le garde de dépôt le fait
    # simplement sauter hors de l'upstream, sans rien changer au comportement upstream.
    if: github.repository == 'twentyhq/twenty' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch to ci-privileged
        env:
          GH_TOKEN: ${{ secrets.CI_PRIVILEGED_DISPATCH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api repos/twentyhq/ci-privileged/dispatches \
            -f event_type=pr-review \
            -f "client_payload[pr_number]=$PR_NUMBER"
