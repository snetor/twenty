name: "Snetor: build & deploy to ACR"

# The Snetor CI/CD standard (azure-landing-zone docs/dated/decisions/cicd-standard.md), since
# 2026-10-02. The image is built by the registry itself (`az acr build`, no Docker: GitHub-hosted
# runners are blocked for the org since 2026-09-23, and the self-hosted runner has no daemon), with
# this repo's own identity `id-ci-twenty-dev`, federated on the `twenty-deploy` environment (whose
# branch policy allows `v*` tags, `snetor/main`, `snetor/prod`). The deploy is an issue
# `deploy: twenty:<tag>` on azure-landing-zone, opened by the `snetor-deploy` App; the landing zone
# patches `twenty-image.auto.tfvars`, applies and runs the db-init Job. This repo no longer holds
# the shared Contributor SP nor `LANDING_ZONE_PAT`.
#
# Release discipline unchanged: tag `vX.Y.Z-snetor.N` on the release commit, APP_VERSION from the
# tag (Twenty refuses to boot on a non-SemVer one). A manual dispatch builds `dev-<sha>` or the
# given tag, with the package.json version.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (default: dev-<short-sha>)"
        required: false
  push:
    tags:
      - "v*"

concurrency:
  group: snetor-deploy
  cancel-in-progress: false

jobs:
  meta:
    runs-on: [self-hosted, linux, snetor-aca]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      app_version: ${{ steps.meta.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute image tag and APP_VERSION
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            APP_VERSION="${TAG#v}"
          else
            TAG="${INPUT_TAG:-dev-$(git rev-parse --short HEAD)}"
            APP_VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing image tag: $TAG  (APP_VERSION=$APP_VERSION)"

  image:
    needs: meta
    uses: snetor/azure-landing-zone/.github/workflows/app-image.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      app: twenty
      registry: acrtwentydevf6fc
      dockerfile: packages/twenty-docker/twenty/Dockerfile
      target: twenty
      build-args: APP_VERSION=${{ needs.meta.outputs.app_version }}
      tag: ${{ needs.meta.outputs.tag }}
      environment: twenty-deploy
      # Measured on 2026-10-02: ~26 minutes uncached on the registry's default agent.
      timeout-minutes: 75
      client-id: ${{ vars.AZURE_CLIENT_ID }}
    secrets:
      deploy-app-key: ${{ secrets.SNETOR_DEPLOY_APP_KEY }}
