name: Auto-Draft External PRs

on:
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  dispatch:
    # Même cause que le garde posé sur `pr-auto-review-dispatch.yaml` (#10), et le même
    # symptôme : ce job appelle `twentyhq/ci-privileged` avec un secret que les forks n'ont
    # pas, `gh` sort en code 4, et le check `dispatch` reste rouge sur toute PR. Il visait
    # les contributeurs externes de l'upstream ; hors de l'upstream, il n'a aucun dépôt à
    # appeler. Le garde de dépôt le fait sauter sans rien changer au comportement upstream.
    if: |
      github.repository == 'twentyhq/twenty' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'COLLABORATOR'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch to ci-privileged
        env:
          GH_TOKEN: ${{ secrets.CI_PRIVILEGED_DISPATCH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
        run: |
          gh api repos/twentyhq/ci-privileged/dispatches \
            -f event_type=convert-pr-to-draft \
            -f "client_payload[pr_number]=$PR_NUMBER" \
            -f "client_payload[pr_node_id]=$PR_NODE_ID"
