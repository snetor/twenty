name: Auto-Draft External PRs

on:
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  dispatch:
    # Même cause que le garde posé sur `pr-auto-review-dispatch.yaml` (#10), et le même
    # symptôme : ce job appelle `twentyhq/ci-privileged` avec un secret que les forks n'ont
    # pas, `gh` sort en code 4, et le check `dispatch` reste rouge sur toute PR. Il visait
    # les contributeurs externes de l'upstream ; hors de l'upstream, il n'a aucun dépôt à
    # appeler. Le garde de dépôt le fait sauter sans rien changer au comportement upstream.
    if: |
      github.repository == 'twentyhq/twenty' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'COLLABORATOR'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint ci-privileged dispatch token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TWENTY_WORKFLOW_DISPATCHER_CLIENT_ID }}
          private-key: ${{ secrets.TWENTY_WORKFLOW_DISPATCHER_PRIVATE_KEY }}
          owner: twentyhq
          repositories: ci-privileged
          permission-actions: write

      - name: Dispatch to ci-privileged
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh workflow run convert-pr-to-draft.yaml --repo twentyhq/ci-privileged --ref main \
            -f pr_number="$PR_NUMBER"
